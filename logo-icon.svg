<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff"/>
      <stop offset="50%" stop-color="#6d5efc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="iconPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff"/>
      <stop offset="60%" stop-color="#6d5efc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Shield -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#iconBg)"/>
  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="13.25" stroke="url(#iconBorder)" stroke-width="1.5" fill="none"/>

  <!-- Stadium Orbit Broadcast Arcs -->
  <path d="M 10 24 A 15 15 0 0 1 24 9" stroke="#38e1ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 8 28 A 18 18 0 0 1 28 7" stroke="#6d5efc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 39 25 A 15 15 0 0 1 25 40" stroke="#a855f7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 41 21 A 18 18 0 0 1 21 42" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Center Play Button -->
  <polygon points="19,16 33,24 19,32" fill="url(#iconPlay)" filter="url(#iconGlow)"/>
  <polygon points="20.5,18.5 30.5,24 20.5,29.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>

  <!-- Live Beacon Dot -->
  <circle cx="37" cy="11" r="3.5" fill="#10b981" filter="url(#iconGlow)"/>
  <circle cx="37" cy="11" r="1.5" fill="#ffffff"/>
</svg>
